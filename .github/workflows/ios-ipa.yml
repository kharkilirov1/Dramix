name: Build unsigned iOS IPA

# Builds an unsigned .ipa on a macOS runner. Signing is done on the device
# (AltStore) with the owner's Apple ID, so no certificates are needed here.
#
# This only runs for free when the repository is public: private repositories
# consume the account's included Actions minutes, and macOS runners are billed
# at 10x.

on:
  workflow_dispatch:
  push:
    branches: [ci/ios-ipa-build]

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build for iOS (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Package Payload into an IPA
        run: |
          set -euo pipefail
          cd build/ios/iphoneos
          rm -rf Payload Dramix-unsigned.ipa
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry Dramix-unsigned.ipa Payload
          ls -l Dramix-unsigned.ipa
          shasum -a 256 Dramix-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: dramix-unsigned-ipa
          path: build/ios/iphoneos/Dramix-unsigned.ipa
          if-no-files-found: error
